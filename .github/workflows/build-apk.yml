name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK with Expo EAS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          rm -rf app-source
          mkdir -p app-source
          unzip -q main.zip -d app-source

          PACKAGE_FILE=$(find app-source -type f -name "package.json" -print -quit)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json नहीं मिली"
            unzip -l main.zip
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")
          echo "Project folder: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Add Expo project ID
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          sed -i '/^  experiments:/i\
            extra: {\
              eas: {\
                projectId: "6a5f1ff2-cbf8-443a-99ea-ce133d37ac6f"\
              }\
            },' app.config.ts

          echo "Expo project ID added:"
          grep -A5 -B2 "projectId" app.config.ts

      - name: Build Android APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: eas build --platform android --profile preview --non-interactive --no-wait
        
